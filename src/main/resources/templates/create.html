<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BlogSpace | Create Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- TinyMCE Rich Text Editor CDN -->
    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 bg-white border-b border-slate-200 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="/" class="font-bold text-xl text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-layer-group"></i> BlogSpace
            </a>
            <div class="flex items-center gap-4">
                <a href="/dashboard" class="text-slate-600 hover:text-indigo-600 font-medium text-sm">Dashboard</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10 w-full">
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">Write & Publish Article</h1>
                <p class="text-sm text-slate-500 mt-1">Use the rich text editor to style your post.</p>
            </div>
        </div>

        <form action="/blogs/save" method="POST" class="bg-white p-8 border border-slate-200 rounded-xl shadow-sm space-y-6">
            
            <!-- Title and Category Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Article Title</label>
                    <input type="text" name="title" required placeholder="Enter a captivating title..." 
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50"/>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Category</label>
                    <input type="text" name="category" required placeholder="e.g., Technology, Design, AI" 
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50"/>
                </div>
            </div>

            <!-- Rich Text Editor Area -->
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Article Body</label>
                <!-- The textarea will be replaced by TinyMCE -->
                <textarea id="rich-text-editor" name="content" placeholder="Start writing your amazing article here..."></textarea>
            </div>

            <div class="pt-4 border-t border-slate-100 flex justify-end gap-4">
                <a href="/dashboard" class="px-6 py-3 text-slate-600 font-bold hover:bg-slate-100 rounded-lg transition">Cancel</a>
                <button type="submit" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-md shadow-indigo-600/20 transition">
                    <i class="fa-solid fa-paper-plane mr-2"></i> Publish Post
                </button>
            </div>
        </form>
    </main>

    <!-- Initialize TinyMCE -->
    <script>
        tinymce.init({
            selector: '#rich-text-editor',
            height: 500,
            menubar: false,
            plugins: [
                'advlist', 'autolink', 'lists', 'link', 'image', 'charmap', 'preview',
                'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen',
                'insertdatetime', 'media', 'table', 'help', 'wordcount'
            ],
            toolbar: 'undo redo | blocks | ' +
                'bold italic forecolor | alignleft aligncenter ' +
                'alignright alignjustify | bullist numlist outdent indent | ' +
                'removeformat | help',
            content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; }'
        });
    </script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Create</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f9]"><div class="flex"><div class="w-72 bg-white h-screen fixed shadow p-7"><h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1><nav class="mt-10 space-y-2"><a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a><a href="/create" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Create</a><a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Explore</a><a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Dashboard</a><a href="/profile" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Profile</a><a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a></nav></div>
<div class="ml-72 p-10 w-full"><div class="bg-white p-8 rounded-[24px] shadow-xl max-w-4xl">
<h2 class="text-3xl font-black mb-6">Create New Blog</h2>
<form action="/publish" method="post">
<input name="title" required placeholder="Blog Title..." class="w-full border-2 p-4 rounded-xl mb-4 text-2xl font-bold outline-none focus:border-indigo-600"/>
<div class="flex gap-2 mb-3 border-2 p-3 rounded-xl bg-gray-50 flex-wrap">
<button type="button" onclick="document.execCommand('bold')" class="px-4 py-2 border bg-white rounded-xl font-black">B</button>
<button type="button" onclick="document.execCommand('italic')" class="px-4 py-2 border bg-white rounded-xl italic font-bold">I</button>
<button type="button" onclick="document.execCommand('underline')" class="px-4 py-2 border bg-white rounded-xl underline font-bold">U</button>
<input type="color" onchange="document.execCommand('foreColor',false,this.value)" class="w-10 h-10 rounded" title="Color"/>
<select onchange="document.execCommand('fontName',false,this.value)" class="border-2 rounded-xl px-3 py-2"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Courier New">Mono</option><option value="Times New Roman">Times</option></select>
<select onchange="document.execCommand('fontSize',false,this.value)" class="border-2 rounded-xl px-3 py-2"><option value="3">Normal</option><option value="5">Large</option><option value="7">Huge</option></select>
</div>
<div id="editor" contenteditable="true" class="w-full border-2 h-[380px] p-5 rounded-xl overflow-auto outline-none focus:border-indigo-600 text-lg" data-placeholder="Start writing your story..."></div>
<textarea name="content" id="hiddenContent" class="hidden"></textarea>
<button type="submit" onclick="document.getElementById('hiddenContent').value=document.getElementById('editor').innerHTML" class="mt-6 bg-indigo-600 text-white px-10 py-4 rounded-full font-black text-lg">Publish Blog</button>
</form></div></div></div></body></html>

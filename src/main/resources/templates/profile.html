<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Profile</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f9]"><div class="flex"><div class="w-72 bg-white h-screen fixed shadow p-7"><h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1><nav class="mt-10 space-y-2"><a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a><a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Create</a><a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Explore</a><a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Dashboard</a><a href="/profile" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Profile</a><a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a></nav></div>
<div class="ml-72 p-10 w-full"><div class="bg-white p-10 rounded-[28px] shadow-sm max-w-2xl">
<div class="flex gap-6 items-center"><img th:src="${user.photoUrl}" class="w-28 h-28 rounded-full border-4 border-indigo-100"/><div><h2 class="text-3xl font-black" th:text="${user.username}"></h2><p class="text-gray-500" th:text="${user.email}"></p><p class="mt-1"><span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold">Age: <span th:text="${user.age}"></span></span> <span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold ml-2">Gender: <span th:text="${user.gender}"></span></span></p></div></div>
<div class="mt-10"><h3 class="font-black text-xl">Help & Support</h3><p class="text-gray-500 text-sm mt-1">Email us at blogspace@gmail.com</p><form action="/help" method="post" class="mt-4"><textarea name="msg" required placeholder="Describe your issue..." class="w-full border-2 p-4 rounded-xl h-28 outline-none focus:border-indigo-600"></textarea><button class="mt-3 bg-black text-white px-8 py-3 rounded-full font-bold">Send Message</button></form></div>
</div></div></div></body></html>

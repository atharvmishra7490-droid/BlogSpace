<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f6f9]">
<div class="flex">
<div class="w-72 bg-white h-screen fixed shadow p-7">
<h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1>
<nav class="mt-10 space-y-2">
<a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a>
<a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Create</a>
<a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Explore</a>
<a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Dashboard</a>
<a href="/profile" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Profile</a>
<a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a>
</nav></div>

<div class="ml-72 p-10 w-full flex justify-center">
<div class="bg-white p-8 rounded-[24px] shadow-sm w-full max-w-2xl">

<div class="flex items-center gap-6">
<img th:if="${user.gender == 'Male'}" th:src="'https://api.dicebear.com/7.x/avataaars/svg?seed='+${user.username}+'-male&sex=male'" class="w-28 h-28 rounded-full border-4 border-indigo-100 bg-indigo-50" alt="male avatar">
<img th:if="${user.gender == 'Female'}" th:src="'https://api.dicebear.com/7.x/avataaars/svg?seed='+${user.username}+'-female&sex=female'" class="w-28 h-28 rounded-full border-4 border-indigo-100 bg-pink-50" alt="female avatar">
<img th:if="${user.gender!= 'Male' and user.gender!= 'Female'}" th:src="'https://api.dicebear.com/7.x/avataaars/svg?seed='+${user.username}" class="w-28 h-28 rounded-full border-4 border-indigo-100 bg-indigo-50" alt="avatar">
<div class="flex-1">
<div class="flex items-center gap-3">
<h2 id="displayName" class="text-3xl font-black" th:text="${user.username}">atharv.16</h2>
<button onclick="toggleEdit()" class="bg-black text-white px-4 py-1.5 rounded-full text-sm font-bold">Edit</button>
</div>
<p class="text-gray-500" th:text="${user.email}">atharvmishra7490@gmail.com</p>
<div class="flex gap-2 mt-2">
<span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold" th:text="'Age: '+${user.age}">Age: 21</span>
<span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold" th:text="'Gender: '+${user.gender}">Gender: Male</span>
</div>
</div>
</div>

<form id="editForm" action="/profile/update" method="post" class="hidden mt-8 space-y-4 border-t pt-6">
<h3 class="font-black text-xl">Edit Profile</h3>
<div class="grid grid-cols-2 gap-4">
<input name="username" th:value="${user.username}" placeholder="Username" class="border-2 p-3 rounded-xl">
<input name="age" th:value="${user.age}" placeholder="Age (11-99)" type="number" min="11" max="99" class="border-2 p-3 rounded-xl focus:border-indigo-600 outline-none">
</div>
<input name="email" th:value="${user.email}" placeholder="Email" class="w-full border-2 p-3 rounded-xl">
<select name="gender" class="w-full border-2 p-3 rounded-xl">
<option th:selected="${user.gender=='Male'}">Male</option>
<option th:selected="${user.gender=='Female'}">Female</option>
<option th:selected="${user.gender=='Other'}">Other</option>
</select>
<div class="flex gap-3">
<button type="submit" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold">Save</button>
<button type="button" onclick="toggleEdit()" class="bg-gray-200 px-8 py-3 rounded-full font-bold">Cancel</button>
</div>
</form>

<div class="mt-8 grid grid-cols-3 gap-4 text-center">
<div class="bg-[#f6f6f9] p-4 rounded-xl"><p class="font-black text-xl" th:text="${postCount}">0</p><p class="text-sm text-gray-500">Posts</p></div>
<div class="bg-[#f6f6f9] p-4 rounded-xl"><p class="font-black text-xl">0</p><p class="text-sm text-gray-500">Followers</p></div>
<div class="bg-[#f6f6f9] p-4 rounded-xl"><p class="font-black text-xl">0</p><p class="text-sm text-gray-500">Following</p></div>
</div>

</div>
</div>
</div>

<script>
function toggleEdit(){
  document.getElementById('editForm').classList.toggle('hidden');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><title>Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f6f9]">
<div class="flex">
<div class="w-72 bg-white h-screen fixed shadow p-7">
<h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1>
<nav class="mt-10 space-y-2">
<a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a>
<a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Create</a>
<a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Explore</a>
<a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Dashboard</a>
<a href="/profile" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Profile</a>
<a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a>
</nav></div>

<div class="ml-72 p-10 w-full flex justify-center">
<div class="bg-white p-8 rounded-[24px] shadow-sm w-full max-w-2xl">

<div class="flex items-center gap-6">
<div id="avatarBox" class="w-28 h-28 rounded-full border-4 border-indigo-100 flex items-center justify-center text-6xl select-none bg-indigo-50"></div>
<div class="flex-1">
<div class="flex items-center gap-3">
<h2 class="text-3xl font-black" th:text="${user.username}">atharv.16</h2>
<button onclick="toggleEdit()" class="bg-black text-white px-4 py-1.5 rounded-full text-sm font-bold">Edit</button>
</div>
<p class="text-gray-500" th:text="${user.email}">atharvmishra7490@gmail.com</p>
<div class="flex gap-2 mt-2">
<span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold" th:text="'Age: '+${user.age}">Age: 21</span>
<span class="bg-gray-100 px-3 py-1 rounded-full text-sm font-bold" th:text="'Gender: '+${user.gender}">Gender: Male</span>
</div>
</div>
</div>

<form id="editForm" action="/profile/update" method="post" class="hidden mt-8 space-y-4 border-t pt-6">
<h3 class="font-black text-xl">Edit Profile</h3>
<div>
<p class="font-bold mb-2">Choose Avatar 🦊🍎🥕</p>
<div id="avatarPicker" class="grid grid-cols-8 gap-2 p-3 bg-[#f6f6f9] rounded-2xl max-h-48 overflow-y-auto"></div>
<input type="hidden" id="selectedAvatarInput" name="avatarIndex">
</div>
<div class="grid grid-cols-2 gap-4">
<input name="username" th:value="${user.username}" placeholder="Username" class="border-2 p-3 rounded-xl">
<input name="age" th:value="${user.age}" placeholder="Age (11-99)" type="number" min="11" max="99" class="border-2 p-3 rounded-xl focus:border-indigo-600 outline-none">
</div>
<input name="email" th:value="${user.email}" placeholder="Email" class="w-full border-2 p-3 rounded-xl">
<select name="gender" class="w-full border-2 p-3 rounded-xl">
<option th:selected="${user.gender=='Male'}">Male</option>
<option th:selected="${user.gender=='Female'}">Female</option>
<option th:selected="${user.gender=='Other'}">Other</option>
</select>
<div class="flex gap-3">
<button type="submit" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold">Save</button>
<button type="button" onclick="toggleEdit()" class="bg-gray-200 px-8 py-3 rounded-full font-bold">Cancel</button>
</div>
</form>

<!-- POSTS FOLLOWERS WALA HATA DIYA -->

</div>
</div>
</div>

<script th:inline="javascript">
function toggleEdit(){ document.getElementById('editForm').classList.toggle('hidden'); }
const username = /*[[${user.username}]]*/ "atharv16";
const avatars = [
  {emoji:"🦊", bg:"bg-orange-100"}, {emoji:"🐼", bg:"bg-gray-100"}, {emoji:"🐶", bg:"bg-yellow-100"},
  {emoji:"🦁", bg:"bg-amber-100"}, {emoji:"🐨", bg:"bg-green-100"}, {emoji:"🐵", bg:"bg-orange-50"},
  {emoji:"🐯", bg:"bg-yellow-50"}, {emoji:"🐻", bg:"bg-amber-50"}, {emoji:"🐹", bg:"bg-lime-100"},
  {emoji:"🐰", bg:"bg-pink-50"}, {emoji:"🦝", bg:"bg-gray-50"}, {emoji:"🐮", bg:"bg-stone-100"},
  {emoji:"🐷", bg:"bg-pink-100"}, {emoji:"🐸", bg:"bg-green-50"}, {emoji:"🐙", bg:"bg-purple-50"},
  {emoji:"🦄", bg:"bg-fuchsia-100"}, {emoji:"🐧", bg:"bg-slate-100"}, {emoji:"🐢", bg:"bg-emerald-50"},
  {emoji:"🍎", bg:"bg-red-100"}, {emoji:"🍌", bg:"bg-yellow-100"}, {emoji:"🍇", bg:"bg-purple-100"},
  {emoji:"🍓", bg:"bg-pink-100"}, {emoji:"🥭", bg:"bg-orange-100"}, {emoji:"🍍", bg:"bg-yellow-50"},
  {emoji:"🍉", bg:"bg-red-100"}, {emoji:"🥝", bg:"bg-lime-100"}, {emoji:"🍊", bg:"bg-orange-50"},
  {emoji:"🥕", bg:"bg-orange-100"}, {emoji:"🌽", bg:"bg-yellow-100"}, {emoji:"🥦", bg:"bg-green-100"},
  {emoji:"🍅", bg:"bg-red-50"}, {emoji:"🥑", bg:"bg-green-50"}, {emoji:"🍆", bg:"bg-purple-50"},
  {emoji:"🌶️", bg:"bg-red-100"}, {emoji:"🍄", bg:"bg-stone-100"}, {emoji:"🐝", bg:"bg-yellow-50"},
  {emoji:"🦋", bg:"bg-purple-50"}, {emoji:"🐠", bg:"bg-blue-50"}
];
let hash = 0;
for(let i=0; i<username.length; i++){ hash = hash * 31 + username.charCodeAt(i); }
let saved = localStorage.getItem('avatar_'+username);
let pickedIndex = saved!== null? parseInt(saved) : Math.abs(hash) % avatars.length;
let picked = avatars[pickedIndex];
const box = document.getElementById('avatarBox');
box.innerText = picked.emoji;
box.className = `w-28 h-28 rounded-full border-4 border-indigo-100 flex items-center justify-center text-6xl select-none ${picked.bg}`;
document.getElementById('selectedAvatarInput').value = pickedIndex;
const picker = document.getElementById('avatarPicker');
avatars.forEach((av, idx)=>{
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.innerText = av.emoji;
  btn.className = `text-2xl p-2 rounded-xl hover:bg-white border-2 transition ${idx==pickedIndex? 'border-indigo-600 bg-white scale-110' : 'border-transparent'} ${av.bg}`;
  btn.onclick = ()=>{
    pickedIndex = idx;
    box.innerText = av.emoji;
    box.className = `w-28 h-28 rounded-full border-4 border-indigo-100 flex items-center justify-center text-6xl select-none ${av.bg}`;
    document.getElementById('selectedAvatarInput').value = idx;
    localStorage.setItem('avatar_'+username, idx);
    [...picker.children].forEach(c=>c.classList.remove('border-indigo-600','bg-white','scale-110'));
    btn.classList.add('border-indigo-600','bg-white','scale-110');
  };
  picker.appendChild(btn);
});
</script>
</body>
</html>

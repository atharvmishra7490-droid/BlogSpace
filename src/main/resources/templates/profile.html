<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BlogSpace | Profile Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="max-w-2xl mx-auto px-6 py-10 space-y-6">
        <a href="/dashboard" class="text-indigo-600 font-bold text-sm">← Back to Dashboard</a>
        <h1 class="text-3xl font-bold">Edit Account Profile</h1>

        <form action="/profile/update" method="POST" class="bg-white p-8 border border-slate-200 rounded-xl shadow-sm space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                <input type="text" name="fullName" th:value="${user.fullName}" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email Address</label>
                <input type="email" name="email" th:value="${user.email}" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"/>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Bio</label>
                <textarea name="bio" rows="4" th:text="${user.bio}" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </div>
            <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">Save Changes</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BlogSpace | Reader View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <article class="max-w-3xl mx-auto px-6 py-12 space-y-6">
        <a href="/" class="text-indigo-600 font-bold text-sm">← Back to Feed</a>
        <span class="block text-xs font-bold uppercase text-indigo-600 tracking-wider" th:text="${blog.category}">Category</span>
        <h1 class="text-4xl font-black text-slate-900" th:text="${blog.title}">Article Header</h1>

        <div class="flex items-center gap-4 text-xs text-slate-500 border-y border-slate-200 py-3">
            <span>By <strong th:text="${blog.author != null ? blog.author.username : 'Unknown'}">Author</strong></span>
            <span>•</span>
            <span th:text="${blog.views} + ' views'">0 views</span>
        </div>

        <div class="prose max-w-none text-slate-700 leading-relaxed text-base whitespace-pre-line" th:text="${blog.content}">
            Content...
        </div>
    </article>
</body>
</html>

<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Blog</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f9]"><div class="flex"><div class="w-72 bg-white h-screen fixed shadow p-7"><a href="/explore" class="font-black text-indigo-600 text-lg">← Back to Explore</a></div>
<div class="ml-72 p-10 w-full"><div class="bg-white p-12 rounded-[28px] shadow-sm max-w-4xl"><h1 class="text-5xl font-black leading-tight" th:text="${blog.title}"></h1><p class="text-gray-500 mt-4 font-bold" th:text="${blog.authorName}+' • '+${#temporals.format(blog.createdAt,'dd MMM yyyy HH:mm')}"></p><div th:utext="${blog.content}" class="mt-10 text-xl leading-relaxed"></div></div></div></div></body></html>

<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f9]"><div class="flex"><div class="w-72 bg-white h-screen fixed shadow p-7"><h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1><nav class="mt-10 space-y-2"><a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a><a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Create</a><a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Explore</a><a href="/dashboard" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Dashboard</a><a href="/profile" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Profile</a><a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a></nav></div>
<div class="ml-72 p-10 w-full"><h1 class="text-4xl font-black">Dashboard</h1>
<div class="grid grid-cols-4 gap-6 mt-8"><div class="bg-white p-7 rounded-[20px] shadow-sm"><p class="text-gray-500 font-bold">Total Blogs</p><p class="text-4xl font-black mt-2" th:text="${total}">0</p></div><div class="bg-white p-7 rounded-[20px] shadow-sm"><p class="text-gray-500 font-bold">My Blogs</p><p class="text-4xl font-black mt-2" th:text="${my}">0</p></div><div class="bg-white p-7 rounded-[20px] shadow-sm"><p class="text-gray-500 font-bold">Today Posted</p><p class="text-4xl font-black mt-2" th:text="${today}">0</p></div><div class="bg-white p-7 rounded-[20px] shadow-sm"><p class="text-gray-500 font-bold">Active Users</p><p class="text-4xl font-black mt-2" th:text="${active}">0</p></div></div>
<h3 class="mt-10 font-black text-2xl">My Blogs</h3><div class="mt-4 space-y-3"><div th:each="b:${myBlogs}" class="bg-white p-5 rounded-xl flex justify-between items-center"><span th:text="${b.title}" class="font-bold"></span><a th:href="@{'/delete/'+${b.id}}" class="bg-red-50 text-red-600 px-4 py-1.5 rounded-full font-bold">Delete</a></div></div>
</div></div></body></html>

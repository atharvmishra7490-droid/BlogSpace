<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BlogSpace | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="max-w-7xl mx-auto px-6 py-10 space-y-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold">Management Dashboard</h1>
                <p class="text-sm text-slate-500 mt-1">Logged in as: <span th:text="${currentUser.username}" class="font-bold text-indigo-600">User</span> (<span th:text="${currentUser.role}">Role</span>)</p>
            </div>
            <a href="/create" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 text-sm">+ New Post</a>
        </div>

        <!-- Real-Time Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Platform Global Posts</span>
                <p class="text-3xl font-black text-slate-900 mt-2" th:text="${totalBlogsCount}">0</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                <span class="text-xs font-bold text-indigo-600 uppercase">Your Published Articles</span>
                <p class="text-3xl font-black text-indigo-600 mt-2" th:text="${userBlogsCount}">0</p>
            </div>
        </div>

        <!-- Manage Articles Table -->
        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-100 text-xs font-bold uppercase text-slate-500 border-b border-slate-200">
                    <tr>
                        <th class="p-4">Title</th>
                        <th class="p-4">Category</th>
                        <th class="p-4">Author</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                    <tr th:each="blog : ${blogs}">
                        <td class="p-4 font-bold text-slate-800" th:text="${blog.title}">Title</td>
                        <td class="p-4 text-slate-500" th:text="${blog.category}">Category</td>
                        <td class="p-4 text-slate-500" th:text="${blog.author != null ? blog.author.username : 'Unknown'}">Author</td>
                        <td class="p-4">
                            <a th:href="@{'/blogs/delete/' + ${blog.id}}" onclick="return confirm('Confirm deletion?')" class="px-3 py-1 bg-red-50 text-red-600 rounded-md font-semibold text-xs hover:bg-red-100">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BlogSpace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style> @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap'); body{font-family:'Outfit',sans-serif} </style>
</head>
<body class="min-h-screen bg-[#0a0a0f] flex items-center justify-center p-4 relative overflow-hidden">
<div class="absolute w-[600px] h-[600px] bg-indigo-600 rounded-full blur-[150px] opacity-30 -top-48 -left-48"></div>
<div class="absolute w-[500px] h-[500px] bg-purple-600 rounded-full blur-[150px] opacity-30 -bottom-32 -right-32"></div>

<div class="relative z-10 w-full max-w-[1050px] bg-white rounded-[32px] shadow-[0_20px_80px_rgba(0,0,0,0.4)] grid md:grid-cols-2 overflow-hidden">

<div class="bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-700 p-10 text-white flex flex-col justify-between">
<div>
<h1 class="text-3xl font-black">BlogSpace.</h1>
<h2 class="text-5xl font-black leading-[0.9] mt-16">Write<br>what you<br>love.</h2>
<p class="mt-6 text-white/70 text-lg">Join 10k+ creators writing premium blogs daily.</p>
</div>
<div class="bg-white/10 backdrop-blur-xl rounded-2xl p-5 border border-white/10 mt-10">
<div class="flex gap-2"><img src="https://i.pravatar.cc/40?img=1" class="w-8 h-8 rounded-full"/><img src="https://i.pravatar.cc/40?img=2" class="w-8 h-8 rounded-full -ml-2"/><img src="https://i.pravatar.cc/40?img=3" class="w-8 h-8 rounded-full -ml-2"/></div>
<p class="text-sm mt-3 font-semibold">"BlogSpace helped me grow from 0 to 50k readers!"</p>
</div>
</div>

<div class="p-8 md:p-10 bg-white">
<div class="flex bg-gray-100 p-1.5 rounded-full w-fit mx-auto">
<button id="tabLogin" onclick="showLogin()" class="px-8 py-2.5 rounded-full bg-black text-white font-bold text-sm transition">Login</button>
<button id="tabSignup" onclick="showSignup()" class="px-8 py-2.5 rounded-full font-bold text-sm text-gray-500 transition">Sign Up</button>
</div>

<p th:if="${error}" th:text="${error}" class="mt-5 bg-red-50 text-red-600 text-sm font-bold p-3 rounded-xl text-center border border-red-100"></p>

<form id="loginForm" action="/doLogin" method="post" class="mt-8 space-y-4">
<h3 class="text-2xl font-black">Welcome back 👋</h3>
<p class="text-gray-500 -mt-3">Login to continue writing</p>
<div class="relative mt-6"><i class="fa fa-user absolute left-4 top-4 text-gray-400"></i><input name="username" required placeholder="Username" class="w-full border-2 pl-11 pr-4 py-3.5 rounded-xl focus:border-indigo-600 outline-none font-medium"/></div>
<div class="relative"><i class="fa fa-lock absolute left-4 top-4 text-gray-400"></i><input name="password" type="password" required placeholder="Password" class="w-full border-2 pl-11 pr-4 py-3.5 rounded-xl focus:border-indigo-600 outline-none font-medium"/></div>
<div class="bg-gray-50 border-2 border-dashed p-3 rounded-xl flex justify-between items-center font-black"><span th:text="${captchaQ}" class="text-indigo-600">2 + 3 =?</span><input name="captchaAns" type="number" required placeholder="Ans" class="border-2 w-20 p-2 rounded-lg text-center font-bold outline-none"/></div>
<button class="w-full bg-black text-white py-4 rounded-xl font-black text-base hover:bg-gray-900 transition flex justify-center gap-2 items-center"><span>Login</span> <i class="fa fa-arrow-right"></i></button>
</form>

<form id="signupForm" action="/signup" method="post" class="mt-8 space-y-3 hidden">
<h3 class="text-2xl font-black">Create account ✨</h3>
<p class="text-gray-500 -mt-3">Start your journey for free</p>
<div class="grid grid-cols-1 gap-3 mt-6">
<input name="username" required minlength="3" placeholder="Username (min 3 chars)" class="w-full border-2 p-3.5 rounded-xl outline-none focus:border-indigo-600 font-medium"/>
<input name="email" type="email" required pattern="[a-zA-Z0-9._%+\-]+@gmail\.com$" title="Only gmail.com allowed - e.g. username@gmail.com" placeholder="Email (username@gmail.com)" class="w-full border-2 p-3.5 rounded-xl outline-none focus:border-indigo-600 font-medium"/>
<input name="password" type="password" required minlength="6" placeholder="Password (min 6 chars)" class="w-full border-2 p-3.5 rounded-xl outline-none focus:border-indigo-600 font-medium"/>
<div class="flex gap-3"><input name="age" type="number" required placeholder="Age" class="w-1/2 border-2 p-3.5 rounded-xl outline-none"/>
<select name="gender" required class="w-1/2 border-2 p-3.5 rounded-xl outline-none bg-white">
<option value="" disabled selected>Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select></div>
<div class="bg-indigo-50 border-2 border-indigo-100 p-3 rounded-xl flex justify-between items-center font-black"><span th:text="${captchaQ}" class="text-indigo-600">2 + 3 =?</span><input name="captchaAns" type="number" required placeholder="Ans" class="border-2 w-20 p-2 rounded-lg text-center font-bold outline-none"/></div>
</div>
<button class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-base hover:bg-indigo-700 transition mt-2">Create Account</button>
<p class="text-center text-xs text-gray-400 mt-2">By signing up you agree to our Terms</p>
</form>

</div>
</div>

<script>
function showLogin(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('signupForm').classList.add('hidden');document.getElementById('tabLogin').className='px-8 py-2.5 rounded-full bg-black text-white font-bold text-sm';document.getElementById('tabSignup').className='px-8 py-2.5 rounded-full font-bold text-sm text-gray-500';}
function showSignup(){document.getElementById('signupForm').classList.remove('hidden');document.getElementById('loginForm').classList.add('hidden');document.getElementById('tabSignup').className='px-8 py-2.5 rounded-full bg-black text-white font-bold text-sm';document.getElementById('tabLogin').className='px-8 py-2.5 rounded-full font-bold text-sm text-gray-500';}
</script>
</body>
</html>

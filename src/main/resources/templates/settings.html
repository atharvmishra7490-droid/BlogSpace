<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Settings</title><script src="https://cdn.tailwindcss.com"></script></head>
<body id="body" class="bg-[#f6f6f9] transition duration-300">
<div class="flex">
<div id="sidebar" class="w-72 bg-white h-screen fixed shadow p-7 transition duration-300">
<h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1>
<nav class="mt-10 space-y-2">
<a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl" data-i18n="home">Home</a>
<a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl" data-i18n="create">Create</a>
<a href="/explore" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl" data-i18n="explore">Explore</a>
<a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl" data-i18n="dashboard">Dashboard</a>
<a href="/profile" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl" data-i18n="profile">Profile</a>
<a href="/settings" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold" data-i18n="settings">Settings</a>
</nav></div>

<div class="ml-72 p-10 w-full">
<div id="card" class="bg-white p-8 rounded-[24px] shadow-sm max-w-xl space-y-6 transition duration-300">
<h2 class="text-3xl font-black" data-i18n="settingsTitle">Settings</h2>

<div id="box1" class="flex justify-between items-center border-2 p-5 rounded-xl">
<div><p class="font-bold" data-i18n="theme">Theme</p><p id="sub1" class="text-sm text-gray-500" data-i18n="themeSub">Light / Dark mode</p></div>
<button onclick="toggleTheme()" class="bg-black text-white px-6 py-2 rounded-full font-bold" data-i18n="toggle">Toggle</button>
</div>

<div id="box2" class="flex justify-between items-center border-2 p-5 rounded-xl">
<div><p class="font-bold" data-i18n="language">Language</p><p id="sub2" class="text-sm text-gray-500" data-i18n="chooseLang">Choose language</p></div>
<select id="langSelect" onchange="changeLanguage(this.value)" class="border-2 p-2 rounded-xl bg-white">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="es">Spanish</option>
</select>
</div>

<div id="box3" class="border-2 p-5 rounded-xl space-y-3">
<p class="font-black text-lg" data-i18n="help">Help & Support</p>
<p class="text-sm text-gray-500" data-i18n="emailUs">Email us at blogspace@gmail.com</p>
<textarea id="helpText" placeholder="Describe your issue..." class="w-full border-2 p-3 rounded-xl h-24 bg-transparent"></textarea>
<button onclick="alert('Message sent to support!')" class="bg-black text-white px-6 py-2.5 rounded-full font-bold" data-i18n="send">Send Message</button>
</div>

<div class="flex gap-4 pt-4">
<a href="/deleteAccount" onclick="return confirm('Are you sure to delete account?')" class="bg-red-600 text-white px-7 py-3 rounded-full font-bold" data-i18n="delete">Delete Account</a>
<button onclick="if(navigator.share){navigator.share({title:'BlogSpace',text:'Join BlogSpace!',url:location.origin})}else{prompt('Copy this link',location.origin)}" class="bg-green-600 text-white px-7 py-3 rounded-full font-bold" data-i18n="refer">Refer to Friends</button>
</div>
</div></div></div>

<script>
let isDark = localStorage.getItem('bs-theme') === 'dark';
function applyTheme(){
  const body = document.getElementById('body');
  const sidebar = document.getElementById('sidebar');
  const card = document.getElementById('card');
  const box1 = document.getElementById('box1');
  const box2 = document.getElementById('box2');
  const box3 = document.getElementById('box3');
  const lang = document.getElementById('langSelect');
  const helpText = document.getElementById('helpText');

  if(isDark){
    body.className = "bg-[#0f0f19] text-white transition duration-300";
    sidebar.className = "w-72 bg-[#1e1e2e] h-screen fixed shadow p-7 transition duration-300 text-white border-r border-gray-800";
    card.className = "bg-[#1e1e2e] text-white p-8 rounded-[24px] shadow-sm max-w-xl space-y-6 transition duration-300 border border-gray-800";
    box1.className = "flex justify-between items-center border border-gray-700 p-5 rounded-xl bg-[#2a2a3e]";
    box2.className = "flex justify-between items-center border border-gray-700 p-5 rounded-xl bg-[#2a2a3e]";
    box3.className = "border border-gray-700 p-5 rounded-xl space-y-3 bg-[#2a2a3e]";
    lang.className = "border border-gray-600 p-2 rounded-xl bg-[#1e1e2e] text-white";
    helpText.className = "w-full border border-gray-600 p-3 rounded-xl h-24 bg-[#1e1e2e] text-white";
  } else {
    body.className = "bg-[#f6f6f9] text-black transition duration-300";
    sidebar.className = "w-72 bg-white h-screen fixed shadow p-7 transition duration-300 text-black";
    card.className = "bg-white text-black p-8 rounded-[24px] shadow-sm max-w-xl space-y-6 transition duration-300";
    box1.className = "flex justify-between items-center border-2 p-5 rounded-xl bg-white";
    box2.className = "flex justify-between items-center border-2 p-5 rounded-xl bg-white";
    box3.className = "border-2 p-5 rounded-xl space-y-3 bg-white";
    lang.className = "border-2 p-2 rounded-xl bg-white text-black";
    helpText.className = "w-full border-2 p-3 rounded-xl h-24 bg-white text-black";
  }
}
function toggleTheme(){
  isDark =!isDark;
  localStorage.setItem('bs-theme', isDark? 'dark' : 'light');
  applyTheme();
}
applyTheme();

// --- LANGUAGE ---
const translations = {
  en: { home:"Home", create:"Create", explore:"Explore", dashboard:"Dashboard", profile:"Profile", settings:"Settings", settingsTitle:"Settings", theme:"Theme", themeSub:"Light / Dark mode", toggle:"Toggle", language:"Language", chooseLang:"Choose language", help:"Help & Support", emailUs:"Email us at blogspace@gmail.com", send:"Send Message", delete:"Delete Account", refer:"Refer to Friends", issue:"Describe your issue..." },
  hi: { home:"होम", create:"बनाएं", explore:"एक्सप्लोर", dashboard:"डैशबोर्ड", profile:"प्रोफाइल", settings:"सेटिंग्स", settingsTitle:"सेटिंग्स", theme:"थीम", themeSub:"लाइट / डार्क मोड", toggle:"बदलें", language:"भाषा", chooseLang:"भाषा चुनें", help:"सहायता और समर्थन", emailUs:"हमें ईमेल करें blogspace@gmail.com पर", send:"संदेश भेजें", delete:"अकाउंट हटाएं", refer:"दोस्तों को भेजें", issue:"अपनी समस्या बताएं..." },
  es: { home:"Inicio", create:"Crear", explore:"Explorar", dashboard:"Panel", profile:"Perfil", settings:"Ajustes", settingsTitle:"Ajustes", theme:"Tema", themeSub:"Modo claro / oscuro", toggle:"Cambiar", language:"Idioma", chooseLang:"Elige idioma", help:"Ayuda y soporte", emailUs:"Envíanos un correo a blogspace@gmail.com", send:"Enviar mensaje", delete:"Eliminar cuenta", refer:"Referir a amigos", issue:"Describe tu problema..." }
};
function applyLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(translations[lang] && translations[lang][key]) el.innerText = translations[lang][key];
  });
  document.getElementById('helpText').placeholder = translations[lang].issue;
}
function changeLanguage(lang){
  localStorage.setItem('bs-lang', lang);
  applyLang(lang);
}
const savedLang = localStorage.getItem('bs-lang') || 'en';
document.getElementById('langSelect').value = savedLang;
applyLang(savedLang);
</script>
</body></html>

<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Explore</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f9]"><div class="flex"><div class="w-72 bg-white h-screen fixed shadow p-7"><h1 class="text-2xl font-black text-indigo-600">BlogSpace.</h1><nav class="mt-10 space-y-2"><a href="/home" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Home</a><a href="/create" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Create</a><a href="/explore" class="flex gap-3 p-3.5 bg-indigo-600 text-white rounded-xl font-bold">Explore</a><a href="/dashboard" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Dashboard</a><a href="/profile" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Profile</a><a href="/settings" class="flex gap-3 p-3.5 hover:bg-gray-100 rounded-xl">Settings</a></nav></div>
<div class="ml-72 p-10 w-full"><div class="flex justify-between items-center"><h1 class="text-4xl font-black">Explore Blogs</h1><form class="flex gap-2"><input name="q" placeholder="Search by title..." class="border-2 p-3 rounded-full w-80 px-6 outline-none focus:border-indigo-600"/><button class="bg-black text-white px-8 rounded-full font-bold">Search</button></form></div>
<div class="grid md:grid-cols-2 gap-6 mt-8"><div th:each="b:${blogs}" class="bg-white p-6 rounded-[20px] shadow-sm hover:shadow-xl transition"><a th:href="@{'/blog/'+${b.id}}" th:text="${b.title}" class="font-black text-xl hover:text-indigo-600"></a><p class="text-sm text-gray-500 mt-1" th:text="${b.authorName}+' • '+${#temporals.format(b.createdAt,'dd MMM yyyy HH:mm')}"></p><div th:utext="${b.content}" class="mt-3 text-gray-700 line-clamp-3"></div></div></div>
</div></div></body></html>

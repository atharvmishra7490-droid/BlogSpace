<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>BlogSpace</title>
<style>
body{font-family:Arial;padding:20px;max-width:800px;margin:auto}
.card{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
button{padding:6px 12px;margin:4px;cursor:pointer}
input,textarea{width:100%;padding:8px;margin:5px 0}
#createBox{display:none}
</style></head>
<body>
<h1 id="logoTitle">BlogSpace</h1>
<div id="auth">
<h3>Login / Register</h3>
<input id="username" placeholder="username (for register)">
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<div id="captchaBox"></div>
<input id="captchaAns" placeholder="captcha answer">
<button onclick="loadCaptcha()">Refresh Captcha</button>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<p id="userInfo"></p>
</div>

<div id="createBox">
<h3>Create Blog</h3>
<input id="title" placeholder="Title">
<textarea id="content" placeholder="Content"></textarea>
<button onclick="addBlog()">Post Blog</button>
</div>

<h2>All Blogs</h2>
<div id="blogs"></div>

<script>
let captchaId=null;
async function loadCaptcha(){
 let r=await fetch('/api/auth/captcha'); let d=await r.json();
 captchaId=d.captchaId; document.getElementById('captchaBox').innerText=d.question;
}
async function register(){
 let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({username:username.value,email:email.value,password:password.value,captchaId,captchaAnswer:captchaAns.value})});
 alert((await r.json()).message||(await r.text())); loadCaptcha();
}
async function login(){
 let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({email:email.value,password:password.value,captchaId,captchaAnswer:captchaAns.value})});
 let d=await r.json();
 if(r.ok){localStorage.setItem('user',JSON.stringify(d)); showUser(); loadBlogs();}
 else alert(d.error); loadCaptcha();
}
function logout(){localStorage.removeItem('user'); localStorage.removeItem('adminMode'); location.reload();}
function showUser(){
 let u=JSON.parse(localStorage.getItem('user')||'null');
 if(u){userInfo.innerText='Logged in as '+u.username; createBox.style.display='block';} 
}
async function loadBlogs(){
 let r=await fetch('/api/blogs'); let list=await r.json();
 let u=JSON.parse(localStorage.getItem('user')||'null'); let uid=u?u.id:null;
 let isAdmin=localStorage.getItem('adminMode')=='true';
 blogs.innerHTML=list.reverse().map(b=>{
   let canDelete = uid && b.ownerId==uid;
   let btn = canDelete?`<button onclick="deleteBlog(${b.id})">Delete</button>`:'';
   if(isAdmin) btn=`<button onclick="deleteBlogAdmin(${b.id})" style="background:red;color:white">DELETE (Admin)</button>`;
   return `<div class="card"><h3>${b.title}</h3><p>${b.content}</p><small>👤 ${b.author||'Anonymous'}</small><br>${btn}</div>`;
 }).join('');
}
async function addBlog(){
 let u=JSON.parse(localStorage.getItem('user'));
 let res=await fetch('/api/blogs',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({title:title.value,content:content.value,ownerId:u.id,author:u.username})});
 if(res.ok){title.value='';content.value='';loadBlogs();}
}
async function deleteBlog(id){
 let u=JSON.parse(localStorage.getItem('user'));
 await fetch(`/api/blogs/${id}?ownerId=${u.id}`,{method:'DELETE'}); loadBlogs();
}
async function deleteBlogAdmin(id){
 let s='ankur123';
 await fetch(`/api/blogs/admin/${id}?secret=${s}`,{method:'DELETE'}); loadBlogs();
}

// SECRET ADMIN - 5 clicks on BlogSpace title
let clicks=0;
document.getElementById('logoTitle').addEventListener('click',()=>{
 clicks++; if(clicks===5){
   let s=prompt('Admin secret:');
   if(s==='ankur123'){localStorage.setItem('adminMode','true'); alert('Admin mode ON'); location.reload();}
   clicks=0;
 }
 setTimeout(()=>clicks=0,3000);
});

loadCaptcha(); showUser(); loadBlogs();
</script>
</body></html>

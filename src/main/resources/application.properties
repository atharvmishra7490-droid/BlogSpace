spring.application.name=BlogSpace
server.port=${PORT:8080}

# Database Config (Embedded H2 for Instant Out-Of-The-Box Run)
spring.datasource.url=jdbc:h2:mem:blogspacedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ORM Auto-schema Setup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Cache Config
spring.thymeleaf.cache=false
# Local = H2 file, Deploy = Postgres via ENV
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/blogdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false

spring.h2.console.enabled=true
server.port=${PORT:8080}
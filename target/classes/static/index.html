<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlogSpace — Share Your Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:#070d26;color:#e2e8f0;min-height:100vh}
.nav{padding:18px 28px;display:flex;justify-content:space-between;align-items:center;background:rgba(7,13,38,0.8);backdrop-filter:blur(12px);border-bottom:1px solid #1e2a5a;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer}
.logo span{color:#60a5fa}
.panel{background:linear-gradient(180deg,#173071 0%,#12265f 100%);border:1px solid #284393;border-radius:18px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
input,textarea{width:100%;background:#0a193c;border:1px solid #2a3e81;border-radius:10px;padding:12px 14px;color:white;margin:7px 0;outline:none;font-size:14px}
input::placeholder,textarea::placeholder{color:#7a8ac0}
input:focus,textarea:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.25)}
.btn{border:none;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.2s}
.btn-b{background:#3b82f6;color:white} .btn-b:hover{background:#2563eb}
.btn-d{background:#1e2f6b;color:#a8b9e6;border:1px solid #2a3e81}
.btn-log{background:#0f1c45;color:#cbd5e1;border:1px solid #2a3e81}
.captcha{background:#0a193c;border:1px solid #2a3e81;border-radius:10px;padding:10px;text-align:left;color:#93c5fd;font-weight:700;margin:7px 0}

/* AUTH VIEW */
#authView{max-width:440px;margin:60px auto;padding:0 20px}
#authView .panel{padding:28px}

/* APP VIEW */
#appView{display:none;max-width:1280px;margin:auto;padding:24px;display:none;grid-template-columns:380px 1fr;gap:26px;align-items:start}
@media(max-width:900px){#appView{grid-template-columns:1fr}}
.blogCard{background:rgba(19,34,95,0.7);border:1px solid #233575;border-radius:16px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px)}
.blogCard h3{margin:0 0 8px;font-size:18px;color:white}
.blogCard p{color:#a8b9e6;line-height:1.6;font-size:14px;margin:0}
.topRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.search{background:#0a193c;border:1px solid #2a3e81;border-radius:10px;padding:10px 14px;color:white;min-width:220px}
.badge{background:#0a193c;border:1px solid #2a3e81;padding:5px 10px;border-radius:999px;font-size:12px;color:#93b1ff}
</style></head>
<body>

<div class="nav">
<div class="logo" id="logoTitle">Blog<span>Space</span> ✨</div>
<div style="display:flex;gap:10px;align-items:center"><span id="userInfo" class="badge">Guest</span><button class="btn btn-log" onclick="logout()">Logout</button></div>
</div>

<!-- BEFORE LOGIN - SAME DARK DESIGN CENTERED -->
<div id="authView">
<div class="panel">
<h3 style="margin:0 0 14px">🔒 Login / Register</h3>
<input id="username" placeholder="Username">
<input id="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<div class="captcha" id="captchaBox">Loading...</div>
<input id="captchaAns" placeholder="Captcha answer">
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-d" onclick="loadCaptcha()">↻ Refresh</button><button class="btn btn-b" onclick="register()">Register</button><button class="btn btn-b" style="background:#38bdf8;color:#00122f" onclick="login()">Login</button></div>
<p style="font-size:12px;color:#7a8ac0;margin-top:14px;text-align:center">Login to unlock all blogs & publish</p>
</div>
</div>

<!-- AFTER LOGIN - PAGE CHANGES, LOGIN GONE -->
<div id="appView">
<div class="panel" style="position:sticky;top:88px">
<h3 style="margin:0 0 14px">✍️ Create Blog</h3>
<input id="title" placeholder="Blog title — make it catchy">
<textarea id="content" rows="9" placeholder="Write your amazing story here..."></textarea>
<button class="btn btn-b" style="width:100%;padding:13px;background:#3b82f6;margin-top:8px;font-size:15px" onclick="addBlog()">Publish Blog 🚀</button>
<div style="margin-top:18px;padding-top:14px;border-top:1px solid #233575;font-size:12px;color:#7a8ac0">Logged in as <b id="meName" style="color:#93c5fd"></b></div>
</div>

<div>
<div class="topRow"><h2 style="margin:0">All Blogs 🔥</h2><input id="search" class="search" placeholder="Search blogs..." oninput="filterBlogs()"></div>
<div id="blogs"><p style="color:#7a8ac0">No blogs yet — be first to post!</p></div>
</div>
</div>

<script>
let captchaId=null,allBlogs=[];
async function loadCaptcha(){let r=await fetch('/api/auth/captcha');let d=await r.json();captchaId=d.captchaId;captchaBox.innerText=d.question;}
async function register(){let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,email:email.value,password:password.value,captchaId,captchaAnswer:captchaAns.value})});let j=await r.json();alert(j.message||j.error);loadCaptcha();}
async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,captchaId,captchaAnswer:captchaAns.value})});let d=await r.json();if(r.ok){localStorage.setItem('user',JSON.stringify(d));checkState();loadBlogs();}else alert(d.error);loadCaptcha();}
function logout(){localStorage.removeItem('user');localStorage.removeItem('adminMode');location.reload();}
function checkState(){
let u=JSON.parse(localStorage.getItem('user')||'null');
if(u){
document.getElementById('authView').style.display='none';
document.getElementById('appView').style.display='grid';
userInfo.innerText='👤 '+u.username;
meName.innerText=u.username;
}else{
document.getElementById('authView').style.display='block';
document.getElementById('appView').style.display='none';
userInfo.innerText='Guest';
}
}
async function loadBlogs(){let r=await fetch('/api/blogs');allBlogs=(await r.json()).slice().reverse();render(allBlogs);}
function render(list){
let u=JSON.parse(localStorage.getItem('user')||'null');let uid=u?u.id:null;let isAdmin=localStorage.getItem('adminMode')=='true';
blogs.innerHTML=list.map(b=>{
let btn='';if(uid&&b.ownerId==uid)btn=`<button class="btn btn-d" style="font-size:12px;margin-top:10px" onclick="deleteBlog(${b.id})">Delete</button>`;
if(isAdmin)btn=`<button class="btn" style="background:#ef4444;color:white;font-size:12px;margin-top:10px" onclick="deleteBlogAdmin(${b.id})">ADMIN DELETE</button>`;
return `<div class="blogCard"><h3>${b.title}</h3><p>${b.content}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="badge">👤 ${b.author||'Anonymous'}</span>${btn}</div></div>`;
}).join('')||'<div class="blogCard" style="text-align:center;color:#7a8ac0">No blogs yet — be first to post!</div>';
}
function filterBlogs(){let q=search.value.toLowerCase();render(allBlogs.filter(b=>b.title.toLowerCase().includes(q)||b.content.toLowerCase().includes(q)));}
async function addBlog(){let u=JSON.parse(localStorage.getItem('user'));if(!u)return alert('Login first');if(!title.value||!content.value)return alert('Fill title+content');let res=await fetch('/api/blogs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,content:content.value,ownerId:u.id,author:u.username})});if(res.ok){title.value='';content.value='';loadBlogs();}}
async function deleteBlog(id){let u=JSON.parse(localStorage.getItem('user'));await fetch(`/api/blogs/${id}?ownerId=${u.id}`,{method:'DELETE'});loadBlogs();}
async function deleteBlogAdmin(id){await fetch(`/api/blogs/admin/${id}?secret=ankur123`,{method:'DELETE'});loadBlogs();}
let clicks=0;logoTitle.addEventListener('click',()=>{clicks++;if(clicks===5){let s=prompt('Admin secret:');if(s==='ankur123'){localStorage.setItem('adminMode','true');alert('Admin ON');location.reload();}clicks=0;}setTimeout(()=>clicks=0,3000);});
loadCaptcha();checkState();loadBlogs();
</script>
</body></html>

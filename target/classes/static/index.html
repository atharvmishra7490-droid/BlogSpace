<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlogSpace • Share Your Thoughts</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eef2ff; --bg2:#f4f6f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --primary:#2563eb; --primary2:#1d4ed8; --shadow:rgba(37,99,235,0.08);
}
body.dark{
  --bg1:#0f172a; --bg2:#020617; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
  --border:#334155; --shadow:rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%);font-family:'Inter',sans-serif;min-height:100vh;padding:30px 20px;color:var(--text);transition:0.3s}
.container{max-width:800px;margin:auto}
header{text-align:center;margin-bottom:30px;position:relative}
header h1{font-family:'Poppins';color:#2563eb;font-size:3rem;letter-spacing:-1px}
header p{color:var(--muted);margin-top:5px;font-size:1.1rem}
.themeBtn{position:absolute;right:0;top:10px;background:var(--card);border:1px solid var(--border);padding:8px 14px;border-radius:30px;cursor:pointer;font-size:14px;box-shadow:0 4px 10px var(--shadow)}
.card{background:var(--card);backdrop-filter:blur(10px);padding:28px;border-radius:16px;box-shadow:0 8px 30px var(--shadow);margin-bottom:30px;border:1px solid var(--border);transition:0.3s}
.card h2{font-family:'Poppins';font-size:1.2rem;margin-bottom:15px;color:var(--text)}
input,textarea{width:100%;padding:14px;margin:8px 0;border:1.5px solid var(--border);border-radius:10px;font-family:'Inter';transition:0.2s;outline:none;background:var(--card);color:var(--text)}
input:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.post-btn{width:100%;padding:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px;transition:0.2s;margin-top:10px}
.post-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,0.3)}
.blog{background:var(--card);padding:22px;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 12px var(--shadow);border:1px solid var(--border);transition:0.2s;animation:fadeIn 0.4s ease}
.blog:hover{transform:translateY(-2px);box-shadow:0 10px 25px var(--shadow)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.blog h3{font-family:'Poppins';font-size:1.25rem;color:var(--text);margin:12px 0 8px;line-height:1.3}
.blog p{color:var(--muted);line-height:1.6;white-space:pre-wrap}
.blog-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.meta{font-size:12.5px;color:#fff;background:linear-gradient(135deg,#2563eb,#3b82f6);display:inline-flex;padding:5px 12px;border-radius:20px;font-weight:500}
.time{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between}
.actions{display:flex;gap:8px}
.delete-btn{background:transparent;color:#ef4444;border:1px solid #fecaca;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;transition:0.2s}
.delete-btn:hover{background:#ef4444;color:white}
.delete-btn.admin-del{background:#0f172a;color:#fbbf24;border-color:#0f172a}
.delete-btn.admin-del:hover{background:#f59e0b;color:#000}
body.dark .delete-btn.admin-del{background:#fbbf24;color:#000}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;opacity:0;transition:0.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;bottom:35px}
.topBar{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 18px;border-radius:12px;margin-bottom:20px;border:1px solid var(--border);flex-wrap:wrap;gap:10px}
.captchaBox{display:flex;gap:8px;align-items:center}
.captchaBox span{background:var(--bg1);padding:10px 14px;border-radius:8px;font-weight:600;color:#2563eb;min-width:90px;text-align:center;border:1px solid var(--border)}
.hide{display:none}
.link{color:#2563eb;cursor:pointer;font-size:13px;text-decoration:underline}
.admin-badge{background:#fef3c7;color:#92400e;font-size:11px;padding:3px 8px;border-radius:10px;margin-left:6px;font-weight:700}
.admin-ctrl{background:#0f172a;color:#fbbf24;border:none;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
body.dark .admin-ctrl{background:#fbbf24;color:#000}
.sectionTitle{font-family:'Poppins';margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="container">
<header>
  <button class="themeBtn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
  <h1>BlogSpace</h1>
  <p>Ideas worth sharing — by everyone, for everyone</p>
</header>

<div id="topBar" class="topBar hide">
  <span id="welcome"></span>
  <div style="display:flex;gap:8px">
    <button class="admin-ctrl" onclick="enableAdminMode()">👑 Admin</button>
    <button class="delete-btn" onclick="logout()">Logout</button>
  </div>
</div>

<div id="authCard" class="card">
<h2 id="authTitle">🔐 Create Account</h2>
<input id="username" placeholder="👤 Username">
<input id="email" placeholder="📧 Email">
<input id="password" type="password" placeholder="🔑 Password">
<div class="captchaBox">
 <span id="captchaQ">Loading...</span>
 <input id="captchaAns" placeholder="Answer" style="margin:0">
 <button class="post-btn" style="width:auto;margin:0;padding:10px 12px" onclick="loadCaptcha()">↻</button>
</div>
<input id="captchaId" type="hidden">
<button id="mainAuthBtn" class="post-btn" onclick="register()">✨ Register</button>
<p style="text-align:center;margin-top:12px"><span class="link" onclick="toggleAuth()" id="toggleLink">Already have account? Login</span></p>
</div>

<div id="blogCard" class="card hide">
<h2>✍️ Create New Blog</h2>
<input id="title" placeholder="💡 Blog Title - Make it catchy!">
<textarea id="content" rows="4" placeholder="📝 What's on your mind today?"></textarea>
<button class="post-btn" onclick="addBlog()">🚀 Publish Blog</button>
</div>

<div class="sectionTitle"><h2 style="font-family:'Poppins';">🌍 Live Feed</h2><span id="blogCount" style="font-size:12px;color:var(--muted)"></span></div>
<div id="list">Loading amazing blogs...</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API='/api';
let isLogin=false;
if(localStorage.getItem('theme')=='dark'){ document.body.classList.add('dark'); document.getElementById('themeBtn').innerText='☀️ Light'; }

function toggleTheme(){
 document.body.classList.toggle('dark');
 let isDark=document.body.classList.contains('dark');
 localStorage.setItem('theme', isDark?'dark':'light');
 document.getElementById('themeBtn').innerText=isDark?'☀️ Light':'🌙 Dark';
}
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function escapeHtml(text){ const div=document.createElement('div'); div.textContent=text||''; return div.innerHTML; }

async function loadCaptcha(){
 try{ let r=await fetch(API+'/auth/captcha'); let j=await r.json();
 document.getElementById('captchaQ').innerText=j.question; document.getElementById('captchaId').value=j.captchaId;
 }catch(e){ document.getElementById('captchaQ').innerText='Offline'; }
}
function toggleAuth(){
 isLogin=!isLogin;
 document.getElementById('authTitle').innerText=isLogin?'🔐 Welcome Back':'🔐 Create Account';
 document.getElementById('username').style.display=isLogin?'none':'block';
 document.getElementById('mainAuthBtn').innerText=isLogin?'🚀 Login':'✨ Register';
 document.getElementById('mainAuthBtn').setAttribute('onclick',isLogin?'login()':'register()');
 document.getElementById('toggleLink').innerText=isLogin?'New here? Create account':'Already have account? Login';
}
async function register(){
 let body={username:username.value.trim(),email:email.value.trim(),password:password.value,captchaId:captchaId.value,captchaAnswer:captchaAns.value};
 if(!body.username||!body.email||!body.password){showToast('⚠️ Fill all fields');return;}
 if(!body.captchaAnswer){showToast('⚠️ Solve captcha');return;}
 let r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j=await r.json(); 
 if(j.error){showToast('❌ '+j.error); loadCaptcha(); return;}
 showToast('✅ Registered! Now Login'); toggleAuth(); loadCaptcha(); password.value=''; captchaAns.value='';
}
async function login(){
 let body={email:email.value.trim(),password:password.value,captchaId:captchaId.value,captchaAnswer:captchaAns.value};
 if(!body.email||!body.password){showToast('⚠️ Fill email & password');return;}
 if(!body.captchaAnswer){showToast('⚠️ Solve captcha');return;}
 let r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j=await r.json(); if(j.error){showToast('❌ '+j.error); loadCaptcha(); return;}
 localStorage.setItem('user',JSON.stringify(j)); showToast('✅ Welcome '+j.username); checkSession();
}
function checkSession(){
 let u=JSON.parse(localStorage.getItem('user')||'null');
 if(!u){
   authCard.classList.remove('hide'); blogCard.classList.add('hide'); topBar.classList.add('hide'); loadCaptcha();
 } else {
   authCard.classList.add('hide'); blogCard.classList.remove('hide'); topBar.classList.remove('hide');
   let isAdminMode = localStorage.getItem('adminMode')=='true';
   welcome.innerHTML='👋 '+escapeHtml(u.username)+' ('+escapeHtml(u.email)+')'+(isAdminMode?' <span class="admin-badge">ADMIN MODE</span>':'');
 }
 loadBlogs();
}
function logout(){localStorage.removeItem('user'); localStorage.removeItem('adminMode'); location.reload();}

function loadBlogs(){
 fetch(API+'/blogs').then(r=>r.json()).then(data=>{
  const list=document.getElementById('list'); list.innerHTML='';
  document.getElementById('blogCount').innerText=data.length+' blogs';
  if(data.length==0){ list.innerHTML='<div style="text-align:center;padding:50px;background:var(--card);border-radius:16px;color:var(--muted);border:1px solid var(--border)">📭 No blogs yet. Be the first to share!</div>'; return; }
  let u=JSON.parse(localStorage.getItem('user')); let uid=u?u.id:null;
  let isAdminMode = localStorage.getItem('adminMode')=='true';
  data.slice().reverse().forEach(b=>{
   const date = b.createdAt ? new Date(b.createdAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}) : 'Just now';
   let canDeleteOwn = uid && b.ownerId==uid;
   let htmlBtn='';
   if(canDeleteOwn) htmlBtn=`<button class="delete-btn" onclick="deleteBlog(${b.id}, false)">🗑 Delete</button>`;
   else if(isAdminMode) htmlBtn=`<button class="delete-btn admin-del" onclick="deleteBlog(${b.id}, true)">👑 DELETE</button>`;
   list.innerHTML+=`
    <div class="blog">
      <div class="blog-top"><span class="meta">👤 ${escapeHtml(b.author || 'Unknown')}</span><div class="actions">${htmlBtn}</div></div>
      <h3>${escapeHtml(b.title)}</h3><p>${escapeHtml(b.content)}</p>
      <div class="time"><span>🕒 ${date}</span><span>#${b.id} • Owner:${b.ownerId}</span></div>
    </div>`;
  });
 });
}
function addBlog(){
 let u=JSON.parse(localStorage.getItem('user'));
 if(!u || !u.username){ showToast('❌ Session expired, login again'); return; }
 const blog={ title:title.value.trim(), content:content.value.trim(), ownerId:u.id, author:u.username };
 if(!blog.title||!blog.content){ showToast('⚠️ Fill title & content'); return; }
 fetch(API+'/blogs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(blog)}).then(r=>r.json()).then(()=>{
  title.value=''; content.value=''; showToast('✅ Blog published!'); loadBlogs();
 });
}
function deleteBlog(id, isAdmin){
 if(!confirm(isAdmin?'ADMIN DELETE this blog permanently?':'Delete this blog?')) return;
 let u=JSON.parse(localStorage.getItem('user'));
 if(isAdmin){
   let secret = prompt('Enter Admin Secret:');
   if(!secret) return;
   fetch(API+'/blogs/admin/'+id+'?secret='+secret,{method:'DELETE'}).then(async r=>{
     let txt = await r.text();
     if(r.status==403) showToast('❌ Wrong secret');
     else { showToast('👑 Admin deleted'); loadBlogs(); }
   });
 } else {
   fetch(API+'/blogs/'+id+'?ownerId='+u.id,{method:'DELETE'}).then(r=>r.json()).then(j=>{
     if(j.error) showToast('❌ '+j.error); else { showToast('🗑️ Deleted'); loadBlogs(); }
   });
 }
}
function enableAdminMode(){
 let s = prompt('Enter Admin Secret to enable admin controls:');
 if(s==='ankur123'){ localStorage.setItem('adminMode','true'); showToast('👑 Admin mode ON - You can delete any blog'); checkSession(); }
 else if(s) showToast('❌ Wrong secret');
}
checkSession();
</script>
</body>
</html>

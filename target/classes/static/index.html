<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlogSpace</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap');
:root{ --bg:#020617; --card:rgba(255,255,255,.07); --border:rgba(255,255,255,.12); --text:#f8fafc; --muted:#94a3b8; --input:#020617; --grad1:#1e3a8a; --grad2:#7c3aed; }
[data-theme="light"]{ --bg:#f8fafc; --card:rgba(255,255,255,.85); --border:rgba(15,23,42,.08); --text:#0f172a; --muted:#64748b; --input:#ffffff; --grad1:#dbeafe; --grad2:#e9d5ff; }
*{box-sizing:border-box} body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.4s}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(800px at 20% 10%,var(--grad1) 0%,transparent 60%),radial-gradient(700px at 90% 80%,var(--grad2) 0%,transparent 60%),var(--bg)}
.nav{padding:18px 36px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.logo{font-family:Fraunces,serif;font-size:28px;font-weight:700;cursor:pointer} .logo i{font-style:normal;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#authView{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:1.2fr .9fr;gap:40px;padding:20px;align-items:center}
@media(max-width:900px){#authView{grid-template-columns:1fr}}
.hero h1{font-family:Fraunces,serif;font-size:68px;line-height:.9;margin:0;letter-spacing:-2.5px} .hero h1 span{background:linear-gradient(90deg,#60a5fa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:var(--card);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:28px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.15)}
input,textarea{background:var(--input);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;width:100%;margin:8px 0;outline:none;transition:.2s} input:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.15)}
.captcha{background:rgba(96,165,250,.12);border:1px dashed #60a5fa;color:#60a5fa;padding:12px;border-radius:12px;text-align:center;font-weight:800;margin:8px 0;font-size:18px;cursor:pointer}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;transition:.2s} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--text);color:var(--bg);width:100%;padding:14px} [data-theme="light"] .btn-primary{background:#0f172a;color:white}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
#appView{display:none;max-width:1250px;margin:auto;padding:0 28px 40px;grid-template-columns:360px 1fr;gap:48px}
@media(max-width:900px){#appView{grid-template-columns:1fr}}
.blogCard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;margin-bottom:16px;transition:.2s}
.blogCard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.badge{font-size:12px;background:var(--card);border:1px solid var(--border);padding:6px 12px;border-radius:999px;color:var(--muted)}
.themeBtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:16px}
</style></head>
<body><div class="bg"></div>
<div class="nav">
<div class="logo" id="logoTitle">Blog<i>Space</i> ✦</div>
<div style="display:flex;align-items:center;gap:10px">
<button class="themeBtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
<span id="userInfo" class="badge" style="display:none"></span>
<button id="logoutBtn" class="btn btn-ghost" style="display:none;padding:8px 14px;font-size:13px" onclick="logout()">Logout</button>
</div></div>

<div id="authView">
<div class="hero"><h1>Where<br><span>stories</span><br>find you.</h1><p style="color:var(--muted);font-size:18px;line-height:1.6;margin-top:16px">Premium writing experience. Dark mode included. Login to unlock Recent Blogs.</p></div>
<div class="card"><h3 style="margin:0 0 4px">Welcome back 👋</h3><p style="margin:0 0 18px;color:var(--muted);font-size:13px">Login to continue</p>
<input id="username" placeholder="Username (for Register)" oninput="validateAuth()">
<input id="email" placeholder="Email must end with .com" oninput="validateAuth()">
<input id="password" type="password" placeholder="Password (min 3 chars)" oninput="validateAuth()">
<div class="captcha" id="captchaBox" onclick="loadCaptcha()">Loading...</div>
<input id="captchaAns" placeholder="Enter captcha answer" oninput="validateAuth()">
<div style="display:flex;gap:10px;margin-top:14px">
<button id="regBtn" class="btn btn-ghost" style="flex:1" onclick="register()" disabled>Register</button>
<button id="loginBtn" class="btn btn-primary" style="flex:1.4" onclick="login()" disabled>Login →</button>
</div>
<p id="errMsg" style="color:#ef4444;font-size:12px;margin-top:10px;display:none"></p>
</div>
</div>

<div id="appView">
<div class="card" style="position:sticky;top:90px;height:fit-content"><h3 style="margin:0">Create story ✍️</h3><p style="color:var(--muted);font-size:12px;margin:6px 0 14px">Hey <b id="meName"></b></p><input id="title" placeholder="Amazing title..."><textarea id="content" rows="8" placeholder="Write your story..."></textarea><button class="btn btn-primary" style="margin-top:12px;background:linear-gradient(90deg,#60a5fa,#a78bfa);color:white" onclick="addBlog()">Publish 🚀</button></div>
<div style="padding-left:12px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--border)">
<h2 style="font-family:Fraunces,serif;font-size:34px;margin:0;letter-spacing:-.8px">Recent Blogs</h2>
<input id="search" style="max-width:240px;border-radius:999px" placeholder="🔍 Search..." oninput="filterBlogs()">
</div>
<div id="blogs"></div>
</div>
</div>

<script>
let captchaId=null,allBlogs=[];
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
themeBtn.innerText = savedTheme==='dark'?'☀️':'🌙';
function toggleTheme(){ let cur = document.documentElement.getAttribute('data-theme'); let next = cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('theme', next); themeBtn.innerText = next==='dark'?'☀️':'🌙'; }

function validateAuth(){
 let u=username.value.trim(), e=email.value.trim().toLowerCase(), p=password.value.trim(), c=captchaAns.value.trim();
 let emailOk = e.includes('@') && e.endsWith('.com') && e.length>7;
 let passOk = p.length>=3;
 let allFilledLogin = e && p && c && emailOk && passOk;
 let allFilledReg = u && e && p && c && emailOk && passOk;
 loginBtn.disabled = !allFilledLogin;
 regBtn.disabled = !allFilledReg;
 if(e && !emailOk){ showErr('Email must contain @ and end with .com'); } else { hideErr(); }
}
function showErr(m){ errMsg.style.display='block'; errMsg.innerText=m; }
function hideErr(){ errMsg.style.display='none'; }

async function loadCaptcha(){let r=await fetch('/api/auth/captcha');let d=await r.json();captchaId=d.captchaId;captchaBox.innerText=d.question+' (click to refresh)';}
async function register(){
  let uName=username.value.trim(), eMail=email.value.trim(), pass=password.value.trim(), ans=captchaAns.value.trim();
  if(!eMail.toLowerCase().endsWith('.com')){ alert('Email must end with .com'); return; }
  let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:uName,email:eMail,password:pass,captchaId,captchaAnswer:ans})});
  let j=await r.json();
  if(r.ok){ alert('Registered! Now Login'); username.value=''; password.value=''; captchaAns.value=''; validateAuth(); loadCaptcha(); }
  else{ alert(j.error); loadCaptcha(); captchaAns.value=''; validateAuth(); }
}
async function login(){
  let eMail=email.value.trim(), pass=password.value.trim(), ans=captchaAns.value.trim();
  let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:eMail,password:pass,captchaId,captchaAnswer:ans})});
  let d=await r.json();
  if(r.ok){ localStorage.setItem('user',JSON.stringify(d)); checkState(); loadBlogs(); }
  else{ alert(d.error); loadCaptcha(); captchaAns.value=''; validateAuth(); }
}
function logout(){ localStorage.removeItem('user'); localStorage.removeItem('adminMode'); location.reload(); }
function checkState(){
  let u=JSON.parse(localStorage.getItem('user')||'null');
  if(u){ authView.style.display='none'; appView.style.display='grid'; userInfo.innerText='👤 '+u.username; userInfo.style.display='inline-block'; meName.innerText=u.username; logoutBtn.style.display='inline-block'; }
  else{ authView.style.display='grid'; appView.style.display='none'; userInfo.innerText=''; userInfo.style.display='none'; logoutBtn.style.display='none'; }
}
async function loadBlogs(){let r=await fetch('/api/blogs');allBlogs=await r.json();render(allBlogs);}
function render(list){let u=JSON.parse(localStorage.getItem('user')||'null');let uid=u?u.id:null;let isAdmin=localStorage.getItem('adminMode')=='true';blogs.innerHTML=list.map(b=>{let btn='';if(uid&&b.ownerId==uid)btn=`<button class="btn btn-ghost" style="font-size:12px;margin-top:10px" onclick="deleteBlog(${b.id})">Delete</button>`;if(isAdmin)btn=`<button class="btn" style="background:#ef4444;color:white;font-size:12px;margin-top:10px" onclick="deleteBlogAdmin(${b.id})">ADMIN DELETE</button>`;return `<div class="blogCard"><h3 style="margin:0 0 8px">${b.title}</h3><p style="color:var(--muted);line-height:1.6;font-size:14px;white-space:pre-wrap">${b.content}</p><div style="display:flex;justify-content:space-between;margin-top:14px"><span class="badge">👤 ${b.author||'Anon'} • ${b.createdAt?new Date(b.createdAt).toLocaleDateString():''}</span>${btn}</div></div>`}).join('')||'<div class="blogCard" style="text-align:center;color:var(--muted)">No blogs yet. Be first!</div>';}
function filterBlogs(){let q=search.value.toLowerCase();render(allBlogs.filter(b=>b.title.toLowerCase().includes(q)||b.content.toLowerCase().includes(q)));}
async function addBlog(){let u=JSON.parse(localStorage.getItem('user'));if(!title.value.trim()||!content.value.trim())return alert('Fill title & content');let res=await fetch('/api/blogs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,content:content.value,ownerId:u.id,author:u.username})});if(res.ok){title.value='';content.value='';loadBlogs();}}
async function deleteBlog(id){let u=JSON.parse(localStorage.getItem('user'));if(!confirm('Delete this blog?'))return;await fetch(`/api/blogs/${id}?ownerId=${u.id}`,{method:'DELETE'});loadBlogs();}
async function deleteBlogAdmin(id){if(!confirm('Admin delete?'))return;await fetch(`/api/blogs/admin/${id}?secret=ankur123`,{method:'DELETE'});loadBlogs();}
let c=0;logoTitle.addEventListener('click',()=>{c++;if(c===5){let s=prompt('Admin secret:');if(s==='ankur123'){localStorage.setItem('adminMode','true');alert('Admin ON');location.reload();}c=0;}setTimeout(()=>c=0,3000);});
loadCaptcha();checkState();loadBlogs();validateAuth();
</script></body></html>
